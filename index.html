<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cut Tracker</title>
<meta name="theme-color" content="#0a7d86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cut Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header with date + tabs; one panel per tab; cards hold one job each. */
:root{
  --bg:#eef3f3; --surface:#ffffff; --raised:#f6f9f9; --ink:#14222a; --muted:#5a6b74; --line:#d6e0e3;
  --accent:#0a7d86; --accent-soft:#d8eff1;
  --kcal:#0a7d86; --prot:#2e7d4f; --prot-soft:#dcf0e3; --carb:#b4620a; --carb-soft:#fbecd8;
  --over:#b3261e; --over-soft:#fbe2df; --warn:#a86500; --warn-soft:#fdf0d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1518; --surface:#152126; --raised:#1b2a30; --ink:#e4edef; --muted:#9aaeb6; --line:#28393f;
  --accent:#4fc4cc; --accent-soft:#143338; --kcal:#4fc4cc; --prot:#77cc98; --prot-soft:#173323; --carb:#f0a64a; --carb-soft:#3a2a14;
  --over:#f2847b; --over-soft:#3d1c1a; --warn:#f0b54a; --warn-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#152126; --raised:#1b2a30; --ink:#e4edef; --muted:#9aaeb6; --line:#28393f;
  --accent:#4fc4cc; --accent-soft:#143338; --kcal:#4fc4cc; --prot:#77cc98; --prot-soft:#173323; --carb:#f0a64a; --carb-soft:#3a2a14;
  --over:#f2847b; --over-soft:#3d1c1a; --warn:#f0b54a; --warn-soft:#3a2c12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 80px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-top:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:1.7rem;text-transform:uppercase}
.save{font-family:var(--mono);font-size:.68rem;padding:3px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);white-space:nowrap}
.save.db{border-style:solid;border-color:var(--prot);color:var(--prot)}
.save.local{border-color:var(--warn);color:var(--warn)}
.datebar{display:flex;align-items:center;gap:6px}
.datebar button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.datebar .dlabel{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:600}
.datebar .dlabel small{display:block;font-family:var(--mono);font-size:.68rem;font-weight:400;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:.8rem}
.pill{font-family:var(--mono);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--raised);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--prot-soft);border-color:var(--prot);color:var(--prot)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pill.bad{background:var(--over-soft);border-color:var(--over);color:var(--over)}

/* summary */
.summary{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.ring .sub{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar-label{display:flex;justify-content:space-between;font-size:.82rem;gap:8px}
.bar-label b{font-family:var(--mono);font-weight:600}
.track{height:10px;border-radius:99px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .3s}
.status{font-size:.86rem}

/* meals */
.slot{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0;padding-top:0}
.slot-head{display:flex;align-items:center;gap:8px}
.slot-head h3{flex:1}
.slot-head .mono{font-size:.78rem;color:var(--muted)}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.food.planned{border-style:dashed}
.food .fname{min-width:0}
.food .fname b{display:block;font-weight:600;font-size:.92rem}
.food .fname small{color:var(--muted);font-size:.76rem;display:block;overflow-wrap:anywhere}
.food .nums{font-family:var(--mono);font-size:.74rem;text-align:right;white-space:nowrap}
.food .nums .p{color:var(--prot)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;line-height:1}
.qty span{font-family:var(--mono);font-size:.78rem;min-width:30px;text-align:center}
.add{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px;color:var(--accent);font-weight:600;font-size:.86rem;text-align:left}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.banner p{flex:1;min-width:180px}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.mini input,.field{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 10px;font-weight:600;font-size:.88rem}
.toggle[aria-pressed="true"]{background:var(--prot-soft);border-color:var(--prot);color:var(--prot)}

/* week chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* picker */
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
[hidden]{display:none!important}
.sheet-body{background:var(--surface);width:100%;max-width:760px;max-height:85vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sheet-list{overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px}
.opt b{display:block;font-size:.92rem}
.opt small{display:block;color:var(--muted);font-size:.76rem}
.opt .nums{font-family:var(--mono);font-size:.74rem;text-align:right;white-space:nowrap}
.opt .flag{color:var(--warn);font-size:.72rem;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.custom{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:end}
.custom label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted)}

/* lift */
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--raised);border-radius:9px;padding:6px 12px;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{border:1px solid var(--line);border-radius:12px;background:var(--raised);overflow:hidden}
.ex summary{list-style:none;cursor:pointer;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ex summary::-webkit-details-marker{display:none}
.ex summary b{display:block}
.ex summary small{display:block;color:var(--muted);font-size:.76rem}
.ex[open] summary{border-bottom:1px solid var(--line)}
.ex .body{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sets{display:grid;grid-template-columns:auto repeat(2,minmax(0,1fr));gap:6px 8px;align-items:center}
.sets .h{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-transform:uppercase}
.sets input{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 8px;width:100%;min-width:0;font-family:var(--mono)}
.hint{border-radius:10px;padding:8px 10px;font-weight:600;font-size:.86rem;background:var(--raised);border:1px solid var(--line)}
.hint.add{background:var(--prot-soft);border-color:var(--prot);color:var(--prot)}
.hint.keep{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hint.down{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.hint.stop{background:var(--over-soft);border-color:var(--over);color:var(--over)}
.last{font-size:.8rem;color:var(--muted)}
.selrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.selrow label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted)}
.selrow select{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 8px}

/* body */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.6rem;line-height:1}
.stat span{font-size:.72rem;color:var(--muted)}

/* prep */
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--prot);margin-top:1px}
.check.done span{color:var(--muted);text-decoration:line-through}
.check small{display:block;color:var(--muted);font-size:.76rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{font-size:.82rem;color:var(--muted)}
.tip{border-left:3px solid var(--carb);background:var(--carb-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.86rem}

/* smart add: scan a label, describe a meal, review before logging */
.actions{display:flex;gap:8px}
#scan-view{width:100%;max-width:380px;border-radius:12px;overflow:hidden;background:#000}
#scan-view video{width:100%!important;display:block}
#upc-form{display:flex;gap:8px}
#upc-form .btn{flex:0 0 auto;white-space:nowrap}
.grade{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ns{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.74rem;padding:3px 10px;border-radius:999px;font-weight:700}
.off-img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line)}
.account form.targets{grid-template-columns:repeat(2,minmax(0,1fr)) auto;align-items:end}
.account form.targets label{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted)}
.account ol{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.88rem;text-align:left;line-height:1.2}
.act svg{flex:0 0 auto}
.act[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.pane{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--raised);position:relative;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:.8rem;line-height:1}
textarea.field{min-height:96px;resize:vertical;font:inherit;line-height:1.4}
.think{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite;flex:0 0 auto}
@keyframes pulse{50%{opacity:.25}}
.err{border-left:3px solid var(--over);background:var(--over-soft);padding:8px 10px;border-radius:0 10px 10px 0;font-size:.86rem}
.rv{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.rv-item{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--raised)}
.rv-head{display:flex;gap:8px;align-items:flex-start}
.rv-head .nm{flex:1;min-width:0;font-size:.86rem;font-weight:600}
.rv-head .nm small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.rv-head button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:28px;height:28px;color:var(--muted)}
.rv-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rv-nums label{display:flex;flex-direction:column;gap:2px;font-size:.62rem;color:var(--muted);font-family:var(--mono);text-transform:uppercase}
.rv-nums input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;width:100%;min-width:0;font-family:var(--mono);font-size:.84rem}
.rv-tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rv-tot div{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.rv-tot b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1}
.rv-tot span{font-size:.66rem;color:var(--muted)}
.rv-more{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.rv ul,.rules{margin:0;padding-left:18px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.chk{display:flex;align-items:center;gap:8px;font-size:.86rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.opt-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.opt-x{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;font-size:.78rem;color:var(--muted)}
.opt-x.armed{border-color:var(--over);color:var(--over);font-weight:600}
/* exploratory test */
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp-row{display:grid;grid-template-columns:104px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:.8rem}
.cmp-row b{font-family:var(--mono);text-align:right;font-size:.8rem}
.cmp-track{height:14px;background:var(--raised);border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.cmp-fill{height:100%;border-radius:99px}
.cmp-range{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 30%,transparent);border-left:2px solid var(--accent);border-right:2px solid var(--accent);border-radius:3px}

@media (max-width:560px){
  .summary{grid-template-columns:1fr;justify-items:center}
  .bars{width:100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .custom{grid-template-columns:repeat(3,minmax(0,1fr))}
  .custom label:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
/* account + backup */
button.save{background:transparent;cursor:pointer}
.save.off{border-color:var(--muted)}
.account .field{max-width:100%}
.account form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.account .row .btn{flex:0 0 auto}
.appnav{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.appnav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:999px}
.appnav a:hover{color:var(--accent)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Cut Tracker</h1><button type="button" id="save" class="save" aria-expanded="false" aria-controls="account">Loading…</button></div>
    <div class="datebar">
      <button type="button" id="prev" aria-label="Previous day">‹</button>
      <div class="dlabel" id="dlabel"></div>
      <button type="button" id="next" aria-label="Next day">›</button>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="food" aria-selected="true">Food</button>
      <button type="button" role="tab" data-tab="lift" aria-selected="false">Lift</button>
      <button type="button" role="tab" data-tab="body" aria-selected="false">Weight</button>
      <button type="button" role="tab" data-tab="prep" aria-selected="false">Prep</button>
    </nav>
    <nav class="appnav" aria-label="More pages"><a href="plan.html">Plan</a><a href="coach.html">Form Coach</a><a href="core.html">Core Routine</a><a href="cook.html">Cooking</a></nav>
  </header>

  <section id="welcome" class="card account" hidden aria-label="Welcome"></section>
  <section id="account" class="card account" hidden aria-label="Account and backup"></section>

  <main id="panel-food" class="panel"></main>
  <main id="panel-lift" class="panel" hidden></main>

/* ===== Helpers ===== */
function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){return new Date(s+"T12:00:00");}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function dow(s){return parse(s).getDay();}
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}
function fmt(n){return Math.round(n).toLocaleString();}
function weekSunday(s){return addDays(s,-dow(s));}
function rotation(s){
  var days=Math.round((parse(s)-parse(START))/86400000);
  if(days<0) return {wk:1,cycle:0,pre:true};
  return {wk:Math.floor(days/7)%3+1,cycle:Math.floor(days/21)+1,pre:false};
}

/* ===== Store (account db with browser fallback) ===== */
var S={tab:"food",date:today(),who:"you",docs:{},mode:"loading"};
try{var pr=JSON.parse(localStorage.getItem("ct-prefs")||"{}");if(pr.tab)S.tab=pr.tab;if(pr.who)S.who=pr.who;}catch(e){}
function prefs(){try{localStorage.setItem("ct-prefs",JSON.stringify({tab:S.tab,who:S.who}));}catch(e){}}
// Device copy: "ct-docs" before sign-in, "ct-docs-<user id>" as an offline cache of that person's account.
function localKey(){return uid?"ct-docs-"+uid:"ct-docs";}
function loadLocal(k){try{return JSON.parse(localStorage.getItem(k||localKey())||"{}")||{};}catch(e){return {};}}
function saveLocal(){try{localStorage.setItem(localKey(),JSON.stringify(S.docs));}catch(e){}}
S.docs=loadLocal();
var uid=null,dirty={},timers={},flushing=false;
// Unsynced ids survive a reload, so entries made offline still reach the account later.
function saveDirty(){if(uid)try{localStorage.setItem("ct-dirty-"+uid,JSON.stringify(Object.keys(dirty)));}catch(e){}}
function loadDirty(){try{return JSON.parse(localStorage.getItem("ct-dirty-"+uid)||"[]")||[];}catch(e){return [];}}
function flush(){
  if(S.mode!=="db"||flushing) return;
  var ids=Object.keys(dirty); if(!ids.length){renderSave();return;}
  flushing=true; renderSave();
  (function next(){
    var id=ids.shift();
    if(!id){flushing=false;renderSave();if(Object.keys(dirty).length&&navigator.onLine)setTimeout(flush,15000);return;}
    var data=S.docs[id];
    AppStore.set(id,data).then(function(){if(S.docs[id]===data)delete dirty[id];saveDirty();next();})
      .catch(function(){flushing=false;renderSave();});
  })();
}
function put(id,data){
  data.updated=new Date().toISOString(); S.docs[id]=data; dirty[id]=true;
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){
    if(S.mode==="db"){ saveLocal(); saveDirty(); flush(); }
    else { saveLocal(); delete dirty[id]; }
  },450);
}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ===== Food logic ===== */
function capNow(){var st=S.docs.settings;return st&&+st.cap>=1000&&+st.cap<=4000?+st.cap:CAP;}
function protNow(){var st=S.docs.settings;return st&&+st.prot>=50&&+st.prot<=300?+st.prot:PROT;}
function dayDoc(s){return S.docs["day_"+s];}
function dayItems(s){
  var d=dayDoc(s); if(d&&d.items) return {items:d.items,planned:false,doc:d};
  return {items:PLAN[dow(s)].map(function(p){return {slot:p[0],id:p[1],q:1};}),planned:true,doc:null};
}
function itemInfo(it){ if(it.id==="custom") return {n:it.n,k:+it.k||0,p:+it.p||0,c:+it.c||0,how:it.how||"Added by you",flag:""}; return FOOD[it.id]||{n:"(removed item)",k:0,p:0,c:0,how:"",flag:""}; }
function totals(items){var t={k:0,p:0,c:0};items.forEach(function(it){var f=itemInfo(it),q=+it.q||1;t.k+=f.k*q;t.p+=f.p*q;t.c+=f.c*q;});return t;}
function isLift(s){return !!DAYS[dow(s)];}
function editDay(fn,quiet){
  var cur=dayItems(S.date), d=cur.doc?clone(cur.doc):{date:S.date,items:clone(cur.items),steps:null,core:false};
  fn(d); put("day_"+S.date,d); if(!quiet) renderFood();
}

  if(S.mode==="db"){el.className="save "+(n?"local":"db");el.textContent=n?(navigator.onLine?"Syncing…":"Offline · "+n+" to sync"):"Saved to your account";}

  else {el.className="save";el.textContent="Loading…";}
  if(!document.getElementById("account").hidden) renderAccount();
}
function renderHeader(){

  ["food","lift","body","prep"].forEach(function(p){document.getElementById("panel-"+p).hidden=p!==S.tab;});

/* ===== Render: food ===== */
function ring(k){
  var CAP=capNow(), pct=Math.min(k/CAP,1), r=62, C=2*Math.PI*r, over=k>CAP;
  var col=over?"var(--over)":"var(--kcal)";
  return '<div class="ring"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--raised)" stroke-width="14"/>'+
   '<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'"/></svg>'+
   '<div class="center"><span class="big">'+fmt(k)+'</span><span class="sub">of '+fmt(CAP)+' kcal</span><span class="sub">'+(over?fmt(k-CAP)+" over":fmt(CAP-k)+" left")+'</span></div></div>';
}
function bar(label,val,goal,color,unit){
  var pct=Math.min(val/goal,1)*100;
  return '<div><div class="bar-label"><span>'+label+'</span><b>'+fmt(val)+' / '+fmt(goal)+unit+'</b></div><div class="track"><div class="fill" style="width:'+pct.toFixed(0)+'%;background:'+color+'"></div></div></div>';
}
function statusFor(t,s){
  var lift=isLift(s), CAP=capNow();
  if(t.k>CAP) return ['bad','Over '+fmt(CAP)+'. Trim tomorrow, don\'t starve today.'];
  if(lift&&t.k<FLOOR) return ['warn','Under 1,200 on a lifting day. Add a snack: chicken bites are the best pick.'];
  if(!lift&&t.k<1100) return ['warn','Pretty low. Add a snack so you don\'t crash tonight.'];
  if(t.p<protNow()*0.85) return ['warn','Calories fine, protein short. Add chicken bites or a yogurt cup.'];
  return ['ok','On target'];
}
function weekChart(){
  var CAP=capNow(),W=320,H=130,pl=30,pb=20,pt=8,days=[],max=Math.max(1800,Math.ceil(CAP/300)*300);
  for(var i=6;i>=0;i--){var s=addDays(S.date,-i),d=dayDoc(s);days.push({s:s,k:d&&d.items?totals(d.items).k:null});}
  days.forEach(function(d){if(d.k&&d.k>max)max=Math.ceil(d.k/300)*300;});
  var y=function(v){return pt+(H-pt-pb)*(1-v/max);}, bw=(W-pl-8)/7;
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Calories for the last 7 days">';
  [0,600,1200,1800].filter(function(v){return v<=max;}).forEach(function(v){g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';});
  days.forEach(function(d,i){
    var x=pl+4+i*bw, lab=parse(d.s).toLocaleDateString(undefined,{weekday:"narrow"});
    if(d.k!=null){var col=d.k>CAP?"var(--over)":d.k<1100?"var(--warn)":"var(--prot)";
      g+='<rect x="'+(x+bw*0.18)+'" y="'+y(d.k)+'" width="'+(bw*0.64)+'" height="'+Math.max(y(0)-y(d.k),1)+'" rx="4" fill="'+col+'"><title>'+d.s+': '+fmt(d.k)+' kcal</title></rect>';}
    else g+='<rect x="'+(x+bw*0.18)+'" y="'+(y(0)-3)+'" width="'+(bw*0.64)+'" height="3" rx="1.5" fill="var(--line)"/>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle"'+(d.s===S.date?' style="font-weight:700;fill:var(--ink)"':'')+'>'+lab+'</text>';
  });
  g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(CAP)+'" y2="'+y(CAP)+'" stroke="var(--over)" stroke-dasharray="4 3" stroke-width="1.5"/>';
  return g+'</svg>';
}
function renderFood(){

  var fa=document.activeElement; if(fa&&fa.closest&&fa.closest("#panel-food")&&fa.blur) fa.blur();
  var cur=dayItems(S.date), t=totals(cur.items), st=statusFor(t,S.date), d=cur.doc||{};

/* ===== Barcode scan: camera (html5-qrcode) → My foods → Open Food Facts. Everything is reviewed before it's logged. ===== */
var ai={busy:"",err:"",review:null,armed:null,upc:null,scanner:null,scanning:false,lib:null};
var SCAN_LIB="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";
var OFF_URL="https://world.openfoodfacts.org/api/v2/product/";
function myFoods(){var d=S.docs.myfoods;return d&&d.items?d.items:[];}
function mineHTML(m){
  return '<div class="opt-wrap"><button type="button" class="opt" data-mine="'+esc(m.id)+'"><span><b>'+esc(m.n)+'</b><small>'+esc((m.serving?m.serving+" · ":"")+(m.src==="label"?"from label":"estimate")+(m.upc?" · barcode saved":""))+'</small></span><span class="nums">'+fmt(m.k)+' kcal<br>'+fmt(m.p)+' g P</span></button>'+
    '<button type="button" class="opt-x'+(ai.armed===m.id?' armed':'')+'" data-unmine="'+esc(m.id)+'" aria-label="Remove '+esc(m.n)+' from My foods">'+(ai.armed===m.id?"Remove?":"✕")+'</button></div>';
}
function num(v){var n=parseFloat(v);return isFinite(n)&&n>=0?Math.round(n*10)/10:null;}
function thinking(){return ai.busy?'<div class="think"><span class="dot" aria-hidden="true"></span><span role="status">'+esc(ai.busy)+'</span></div>':'';}
function errBox(){return ai.err?'<p class="err" role="alert">'+esc(ai.err)+'</p>':'';}
function scanHTML(){
  var h='<div class="pane"><div id="scan-view" aria-label="Camera view"'+(ai.scanning?'':' hidden')+'></div>';
  if(ai.scanning) h+='<div class="row"><span class="note" role="status">Point the camera at the barcode. It reads on its own.</span><span class="spacer"></span><button type="button" class="btn small" data-ai="stopcam">Stop</button></div>';
  else if(!ai.busy) h+='<div class="row"><button type="button" class="btn primary" data-ai="cam">Open the camera</button></div>';
  h+='<form id="upc-form"><input id="upc" class="field" inputmode="numeric" placeholder="Or type the digits under the barcode" aria-label="Barcode digits" value="'+esc(ai.upc||"")+'"><button type="submit" class="btn">Look up</button></form>';
  h+='<p class="note">Looks the product up in <b>Open Food Facts</b>, a free community database. Entries can be missing or wrong, so check the numbers against the package. Scanned items save to My foods, so the next scan is instant.</p>';
  return h+thinking()+errBox()+'</div>';
}
function loadScanLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  if(ai.lib) return ai.lib;
  ai.lib=new Promise(function(res,rej){var sc=document.createElement("script");sc.src=SCAN_LIB;sc.onload=res;sc.onerror=function(){ai.lib=null;rej(new Error("load"));};document.head.appendChild(sc);});
  return ai.lib;
}
function camErr(e){
  var t=String(e&&(e.name||e.message||e));
  if(/NotAllowed|Permission|denied/i.test(t)) return "Camera access was denied. Allow it for this site in your browser settings, or type the digits.";
  if(/NotFound|no camera|Requested device|OverconstrainedError/i.test(t)) return "No back camera found. Type the digits instead.";
  if(/NotReadable|in use|AbortError/i.test(t)) return "The camera is busy in another app. Close it and try again.";
  return "Couldn't start the camera. Type the digits instead.";
}
async function startCam(){
  if(ai.scanning||ai.busy) return;
  ai.err=""; ai.busy="Starting the camera…"; renderPicker();
  try{await loadScanLib();}catch(e){ai.busy="";ai.err="Couldn't load the scanner. Are you offline? Type the digits instead.";renderPicker();return;}
  ai.busy=""; ai.scanning=true; renderPicker(); // the camera view must exist, and must not be re-rendered while scanning
  var F=window.Html5QrcodeSupportedFormats, sc;
  try{
    sc=new window.Html5Qrcode("scan-view",{formatsToSupport:F?[F.EAN_13,F.UPC_A,F.EAN_8,F.UPC_E]:undefined,experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    ai.scanner=sc;
    await sc.start({facingMode:"environment"},{fps:10,aspectRatio:1.5,qrbox:function(w,h){return {width:Math.round(Math.min(w*0.85,320)),height:Math.round(Math.min(h*0.5,160))};}},
      function(text){if(ai.scanner!==sc)return;var code=normUPC(text);if(!code)return;if(navigator.vibrate)try{navigator.vibrate(40);}catch(x){}stopCam();lookupUPC(code);},function(){});
  }catch(e){ai.scanner=null;ai.scanning=false;ai.err=camErr(e);renderPicker();}
}
function stopCam(){var sc=ai.scanner;ai.scanner=null;ai.scanning=false;if(sc){try{var p=sc.stop();if(p&&p.catch)p.catch(function(){});}catch(e){}}}
async function lookupUPC(code){
  ai.upc=code; ai.err="";
  var hit=findUPC(code);
  if(hit){ai.review=fromMine(hit);pick.cat="review";renderPicker();return;}
  ai.busy="Looking up "+code+"…"; renderPicker();
  var ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},10000);
  try{
    var r=await fetch(OFF_URL+encodeURIComponent(code)+".json?fields=product_name,product_name_en,brands,serving_size,nutriments,nutriscore_grade,nova_group,image_front_small_url",{signal:ctl.signal});
    clearTimeout(tm); ai.busy="";
    var j=null; try{j=await r.json();}catch(e){}
    var prod=j&&j.status===1&&j.product?j.product:null;
    if(!prod){
      if(!r.ok&&r.status!==404) throw new Error("http "+r.status);
      pick.cat="scan"; ai.err="Barcode "+code+" isn't in Open Food Facts yet. Tap \"Type numbers\" and copy the label; it'll be saved with this barcode for next time."; renderPicker(); return;
    }
    ai.review=fromOFF(prod,code); pick.cat="review"; renderPicker();
  }catch(e){
    clearTimeout(tm); ai.busy=""; pick.cat="scan";
    ai.err=e&&e.name==="AbortError"?"Open Food Facts didn't answer in time. Try again, or type the numbers.":"Couldn't reach Open Food Facts. Offline? Type the numbers instead.";
    renderPicker();
  }
}
function fromOFF(p,code){
  var n=p.nutriments||{}, perServ=n["energy-kcal_serving"]!=null&&n["energy-kcal_serving"]!=="", sfx=perServ?"_serving":"_100g";
  var g=function(k){var v=n[k+sfx];return v==null||v===""?null:num(v);};
  var na=g("sodium"); if(na!=null) na=Math.round(na*1000); // Open Food Facts stores sodium in grams
  var brand=p.brands?String(p.brands).split(",")[0].trim():"", pn=String(p.product_name_en||p.product_name||"").trim();
  var name=(pn.toLowerCase().indexOf(brand.toLowerCase())===0||!brand?pn:brand+" "+pn).slice(0,60)||"Scanned product";
  var notes=[perServ?"Per the serving size on file.":"No per-serving data on file, so these are per 100 g. Set servings to what you ate: 0.5 for 50 g."];
  return {src:"off",kind:"label",name:name,serving:(perServ?(p.serving_size?String(p.serving_size):"1 serving"):"100 g").slice(0,40),upc:code,q:1,save:true,confidence:perServ?"medium":"low",added:null,
    grade:/^[a-e]$/.test(String(p.nutriscore_grade||""))?String(p.nutriscore_grade):null,nova:+p.nova_group>=1&&+p.nova_group<=4?+p.nova_group:null,img:p.image_front_small_url||null,
    rows:[{name:perServ?"Per serving":"Per 100 g",k:g("energy-kcal"),p:g("proteins"),c:g("carbohydrates"),f:g("fat"),na:na,sug:g("sugars")}],notes:notes};
}
function gradeHTML(R){
  var NS={a:"#1e8f4e",b:"#85bb2f",c:"#f3c300",d:"#ee8100",e:"#e63e11"}, NOVA=["","Unprocessed","Processed ingredient","Processed","Ultra-processed"];
  var h='<div class="grade">'+(R.img?'<img class="off-img" src="'+esc(R.img)+'" alt="" loading="lazy">':'');
  h+=R.grade?'<span class="ns" style="background:'+NS[R.grade]+';color:'+(R.grade==="b"||R.grade==="c"?"#14222a":"#fff")+'">Nutri-Score '+R.grade.toUpperCase()+'</span>':'<span class="pill">No Nutri-Score on file</span>';
  if(R.nova) h+='<span class="pill'+(R.nova===4?' bad':R.nova===3?' warn':' ok')+'">NOVA '+R.nova+' · '+NOVA[R.nova]+'</span>';
  return h+'</div>';
}
/* Review: everything is editable before it's logged. Totals are computed here, never taken from the database. */
function perPortion(R){var t={k:0,p:0,c:0,f:0,na:null,sug:null};R.rows.forEach(function(r){t.k+=+r.k||0;t.p+=+r.p||0;t.c+=+r.c||0;t.f+=+r.f||0;if(r.na!=null&&r.na!==""){t.na=(t.na||0)+(+r.na||0);}if(r.sug!=null&&r.sug!==""){t.sug=(t.sug||0)+(+r.sug||0);}});return t;}
function totHTML(R){
  var t=perPortion(R),q=R.q,calc=4*t.p+4*t.c+9*t.f,off=t.k>0&&Math.abs(calc-t.k)>Math.max(40,t.k*0.25);
  return '<div class="rv-tot"><div><b>'+fmt(t.k*q)+'</b><span>kcal</span></div><div><b>'+fmt(t.p*q)+'</b><span>protein g</span></div><div><b>'+fmt(t.c*q)+'</b><span>carbs g</span></div><div><b>'+fmt(t.f*q)+'</b><span>fat g</span></div></div>'+
    ((t.na!=null||t.sug!=null)?'<p class="rv-more">'+(t.na!=null?'Sodium '+fmt(t.na*q)+' mg':'')+(t.na!=null&&t.sug!=null?' · ':'')+(t.sug!=null?'Sugar '+fmt(t.sug*q)+' g'+(R.added!=null?' ('+fmt(R.added*q)+' g added)':''):'')+'</p>':'')+
    (off?'<p class="tip">These don\'t add up: protein, carbs and fat work out to about '+fmt(calc*q)+' kcal, not '+fmt(t.k*q)+'. Check the numbers against the label before logging.</p>':'');
}
function srcLabel(R){return R.src==="off"?"From Open Food Facts":R.src==="label"?"Read from the label":R.src==="mine"?"From My foods":R.src==="photo"?"Estimate from a photo":"Estimate";}
function reviewHTML(){
  var R=ai.review, single=["breakfast","lunch","dinner"].indexOf(pick.slot)>=0, filled=single&&dayItems(S.date).items.some(function(it){return it.slot===pick.slot;});
  var conf=R.src==="mine"?"ok":R.confidence==="high"?"ok":R.confidence==="low"?"bad":"warn";
  var h='<div class="rv"><div class="row"><span class="pill '+conf+'">'+esc(srcLabel(R))+(R.src!=="mine"&&R.confidence?" · "+esc(R.confidence)+" confidence":"")+'</span>'+(R.upc?'<span class="rv-more">Barcode '+esc(R.upc)+'</span>':'')+'</div>';
  if(R.src==="off") h+=gradeHTML(R);
  h+='<label class="lbl" for="rv-name">Name<input id="rv-name" class="field" value="'+esc(R.name)+'" maxlength="60"></label>';
  R.rows.forEach(function(r,i){
    h+='<div class="rv-item"><div class="rv-head"><span class="nm">'+esc(r.name||"Per serving")+(r.amount?'<small>'+esc(r.amount)+'</small>':'')+'</span>'+(R.rows.length>1?'<button type="button" data-ai="rmrow" data-i="'+i+'" aria-label="Remove '+esc(r.name)+'">✕</button>':'')+'</div><div class="rv-nums">'+
      [["k","kcal"],["p","protein"],["c","carbs"],["f","fat"]].map(function(x){return '<label>'+x[1]+'<input type="number" inputmode="decimal" min="0" step="any" data-rv="'+i+'" data-f="'+x[0]+'" value="'+(r[x[0]]==null?"":r[x[0]])+'"></label>';}).join("")+'</div></div>';
  });
  h+='<div class="row"><span>'+(R.kind==="label"||R.src==="mine"?"Servings you ate":"Portions")+(R.serving?' <span class="rv-more">(1 = '+esc(R.serving)+')</span>':'')+'</span><span class="spacer"></span><div class="qty"><button type="button" data-ai="q" data-d="-0.25" aria-label="Less">−</button><span id="rv-q">'+R.q+'×</span><button type="button" data-ai="q" data-d="0.25" aria-label="More">+</button></div></div>';
  h+='<div id="rv-tot">'+totHTML(R)+'</div>';
  if(R.notes&&R.notes.length) h+='<ul>'+R.notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join("")+'</ul>';
  if(R.src!=="mine") h+='<label class="chk"><input type="checkbox" id="rv-save"'+(R.save?' checked':'')+'> Save to My foods'+(R.upc?' (with its barcode)':'')+'</label>';
  h+='<div class="row"><button type="button" class="btn primary" data-ai="add">'+(filled?"Replace ":"Add to ")+esc(SLOTS.filter(function(x){return x[0]===pick.slot;})[0][1].toLowerCase())+'</button>'+(filled?'<button type="button" class="btn" data-ai="along">Add alongside</button>':'')+'<span class="spacer"></span><button type="button" class="btn ghost small" data-ai="again">Start over</button></div>';
  if(R.src!=="mine") h+='<p class="note">Database entries can be wrong or out of date. A quick look at the package beats trusting it blind.</p>';
  return h+'</div>';
}
function fromMine(m){return {src:"mine",kind:"label",name:m.n,serving:m.serving||"",upc:m.upc||null,q:1,save:false,mid:m.id,rows:[{name:"Per serving",k:m.k,p:m.p,c:m.c,f:m.f,na:m.na,sug:m.sug}],notes:[]};}
function addReview(alongside){
  var R=ai.review, t=perPortion(R), name=(document.getElementById("rv-name").value||R.name||"Food").trim().slice(0,60);
  var how=R.src==="off"?(R.serving?R.serving+" · ":"")+"Open Food Facts":R.src==="label"?(R.serving?R.serving+" · ":"")+"from label":R.src==="mine"?"My food"+(R.serving?" · "+R.serving:""):R.src==="photo"?"Photo estimate":"Estimate: "+R.rows.map(function(r){return r.name;}).join(", ").slice(0,90);
  var sv=document.getElementById("rv-save");
  if(sv&&sv.checked){
    var mf=clone(myFoods()), it={id:"m"+Date.now().toString(36),n:name,serving:R.serving||"",k:t.k,p:t.p,c:t.c,f:t.f,na:t.na,sug:t.sug,upc:R.upc||null,src:R.src==="label"||R.src==="off"?"label":"estimate",added:today()};
    mf=mf.filter(function(m){return !(it.upc&&m.upc===it.upc)&&m.n.toLowerCase()!==name.toLowerCase();}); mf.unshift(it);
    put("myfoods",{items:mf.slice(0,200)});
  }
  var item={id:"custom",n:name,k:Math.round(t.k),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f),how:how,q:R.q,src:R.src};
  resetAI(); choose(item,alongside);
}
function resetAI(){stopCam();ai.review=null;ai.err="";ai.busy="";ai.armed=null;ai.upc=null;}
function normUPC(v){var d=String(v||"").replace(/\D/g,"");if(d.length<8||d.length>14)return null;return d.length===12?"0"+d:d;} // UPC-A and EAN-13 compare equal
function findUPC(code){if(!code)return null;return myFoods().filter(function(m){return m.upc===code;})[0]||null;}
function aiClick(b){
  var a=b.dataset.ai;
  if(a==="cam") startCam();
  else if(a==="stopcam"){stopCam();renderPicker();}
  else if(a==="rmrow"){ai.review.rows.splice(+b.dataset.i,1);renderPicker();}
  else if(a==="q"){ai.review.q=Math.max(0.25,Math.min(10,Math.round((ai.review.q+(+b.dataset.d))*100)/100));document.getElementById("rv-q").textContent=ai.review.q+"×";document.getElementById("rv-tot").innerHTML=totHTML(ai.review);}
  else if(a==="add"||a==="along") addReview(a==="along");
  else if(a==="again"){resetAI();pick.cat="scan";renderPicker();}
}

/* ===== Exploratory: 14-day test that estimates maintenance from your own logs and weigh-ins ===== */
function expInfo(){
  var e=S.docs.exp; if(!e||!e.start) return null;
  var start=e.start, end=addDays(start,13), t=today(), done=t>end, last=done?end:t;
  var n=Math.max(0,Math.min(14,Math.round((parse(last)-parse(start))/864e5)+1)), logged=[], wts=[];
  for(var i=0;i<n;i++){var s=addDays(start,i),d=dayDoc(s);if(d&&d.items&&d.items.length)logged.push(totals(d.items).k);var b=S.docs["body_"+s];if(b&&+b.w>0)wts.push([i,+b.w]);}
  var avg=logged.length?logged.reduce(function(a,k){return a+k;},0)/logged.length:null, fit=null;
  if(wts.length>=5&&wts[wts.length-1][0]-wts[0][0]>=6){
    var mx=0,my=0;wts.forEach(function(p){mx+=p[0];my+=p[1];});mx/=wts.length;my/=wts.length;
    var sxx=0,sxy=0;wts.forEach(function(p){sxx+=(p[0]-mx)*(p[0]-mx);sxy+=(p[0]-mx)*(p[1]-my);});
    var b1=sxy/sxx,sse=0;wts.forEach(function(p){var r=p[1]-(my+b1*(p[0]-mx));sse+=r*r;});
    fit={slope:b1,se:Math.sqrt(sse/(wts.length-2))/Math.sqrt(sxx)};
  }
  var maint=avg!=null&&fit?avg-fit.slope*3500:null, half=fit?1.96*fit.se*3500:null;

}
function cmpRow(label,v,max,color){

     '<div class="stat"><b>'+(x.avg!=null?fmt(x.avg):"–")+'</b><span>avg kcal logged</span></div><div class="stat"><b>'+(x.fit?(x.fit.slope<=0?"−":"+")+Math.abs(x.fit.slope*7).toFixed(1):"–")+'</b><span>lb per week (trend)</span></div></div>';
  if(x.logged<x.n*0.8&&x.n>=3) h+='<p class="tip">Only '+x.logged+' of '+x.n+' days logged so far. Unlogged days are skipped, so the result gets shakier with each one.</p>';

    h+='<p>At '+fmt(CAPN)+' a day you\'d lose about <b>'+(loss>0?loss.toFixed(1)+' lb a week':'nothing')+'</b> (rough).'+(loss>2?' That\'s faster than about 2 lb a week, which tends to cost muscle.':'')+'</p>';

function hintFor(e,who,wk){
  var tgt=who==="friend"?[4,3,2][wk-1]:[3,2,1][wk-1];
  if(!e) return null;
  var pain=e.pain===""||e.pain==null?null:+e.pain, rir=e.rir===""||e.rir==null?null:+e.rir;
  if(pain!=null&&pain>=5) return ["stop","Stop: skip this next time and ask the PT"];
  if(pain!=null&&pain>=3) return ["down","Lighten it or shorten the range"];
  if(rir==null) return null;
  var unit=e.u, hasLb=(e.s||[]).some(function(x){return x&&+x[0]>0;});
  if(rir>tgt) return ["add",unit==="sec"?"Add 5 seconds next time":(!hasLb?"Add 2 reps next time":"Add 5 lb per side next time")];
  if(rir<tgt-1) return ["down","Too heavy: drop 5 lb next time"];
  return ["keep","Keep the same next time"];
}
function lastFor(key,who,before){
  var best=null;
  Object.keys(S.docs).forEach(function(id){
    if(id.indexOf("lift_"+who+"_")!==0) return; var d=S.docs[id]; if(!d||!d.ex||d.date>=before) return;
    var e=d.ex[key]; if(!e||!(e.s||[]).some(function(x){return x&&(x[0]||x[1]);})) return;
    if(!best||d.date>best.date) best={date:d.date,e:e};
  });
  return best;
}
function summarize(e){
  var sets=(e.s||[]).filter(function(x){return x&&(x[0]||x[1]);});

  var u=e.u==="sec"?" s":" reps";
  return (top[0]?top[0]+" lb × ":"")+(top[1]||"?")+u+" · "+sets.length+" set"+(sets.length>1?"s":"")+(e.rir!==""&&e.rir!=null?" · "+e.rir+" left":"");
}

function avg7(data,upto){var from=addDays(upto,-6),xs=data.filter(function(p){return p.d>=from&&p.d<=upto;});if(!xs.length)return null;return xs.reduce(function(a,p){return a+p.w;},0)/xs.length;}

function weightChart(data){
  var W=320,H=170,pl=36,pr=8,pt=10,pb=22, pts=data.slice(-60);
  var d0=parse(pts[0].d),d1=parse(pts[pts.length-1].d),span=Math.max(1,(d1-d0)/86400000);
  var ws=pts.map(function(p){return p.w;}),lo=Math.floor(Math.min.apply(null,ws)-1),hi=Math.ceil(Math.max.apply(null,ws)+1);
  if(hi-lo<4){hi+=2;lo-=2;}
  var x=function(s){return pl+(W-pl-pr)*((parse(s)-d0)/86400000)/span;}, y=function(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));};
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend">', step=Math.max(1,Math.round((hi-lo)/4));
  for(var v=lo;v<=hi;v+=step){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';}
  pts.forEach(function(p){g+='<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="2.5" fill="var(--muted)"><title>'+p.d+': '+p.w+' lb</title></circle>';});
  var line=pts.map(function(p){return [x(p.d),y(avg7(data,p.d))];});
  if(line.length>1) g+='<polyline points="'+line.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  var l=line[line.length-1]; g+='<circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="4.5" fill="var(--accent)"/>';
  g+='<text x="'+pl+'" y="'+(H-6)+'">'+esc(d0.toLocaleDateString(undefined,{month:"short",day:"numeric"}))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(d1.toLocaleDateString(undefined,{month:"short",day:"numeric"}))+'</text>';
  return g+'</svg>';
}

/* ===== Account, sign-in and backup ===== */
var acct={sent:"",err:"",busy:false,saved:false};
function renderAccount(){
  var el=document.getElementById("account"), u=AppStore.user(), h='';
  if(S.mode==="db"&&u){
    h+='<div class="row"><h3>Your account</h3><span class="spacer"></span><span class="pill ok">Synced</span></div>'+
       '<p>Signed in as <b>'+esc(u.email||"you")+'</b>. Everything you log is saved to your account and only you can see it.</p>'+
       '<div class="row"><button type="button" class="btn small" data-acct="signout">Sign out</button></div>';
  } else if(AppStore.enabled){
    h+='<div class="row"><h3>Sign in to save</h3></div>'+
       '<p class="note">Right now entries stay on this phone. Sign in with your email to keep them in your account, on any device. Each person only sees their own log.</p>';
    if(acct.sent) h+='<p class="tip">Check <b>'+esc(acct.sent)+'</b> for a sign-in link and open it on this device. It can take a minute; check spam too.</p>';
    h+='<form id="signin"><input id="email" class="field" type="email" autocomplete="email" required placeholder="you@example.com" aria-label="Email"><button type="submit" class="btn primary"'+(acct.busy?' disabled':'')+'>'+(acct.busy?"Sending…":"Email me a link")+'</button></form>';
  } else {
    h+='<div class="row"><h3>Saved on this phone</h3></div>'+
       '<p class="note">This copy isn\'t connected to a database yet, so entries stay on this device. Export a backup now and then.</p>';
  }
  if(acct.err) h+='<p class="err">'+esc(acct.err)+'</p>';
  h+='<div class="row"><h3>Your targets</h3></div><form id="targets" class="targets"><label for="t-cap">Calorie cap<input id="t-cap" class="field" type="number" inputmode="numeric" min="1000" max="4000" step="50" value="'+capNow()+'" required></label><label for="t-prot">Protein g / day<input id="t-prot" class="field" type="number" inputmode="numeric" min="50" max="300" step="5" value="'+protNow()+'" required></label><button type="submit" class="btn small">Save</button></form>'+
     '<p class="note">'+(acct.saved?'Saved. ':'')+'Defaults are one person\'s numbers (1,500 kcal, 150 g protein), not yours. A rough protein target is 0.7 to 1 g per pound of goal body weight.</p>';
  h+='<div class="row"><button type="button" class="btn small ghost" data-acct="export">Export backup</button>'+
     '<label class="btn small ghost" for="import-file" style="cursor:pointer">Import backup</label><input id="import-file" type="file" accept="application/json,.json" class="vh"></div>';
  var keep=document.activeElement&&document.activeElement.id==="email"?document.getElementById("email").value:null;
  el.innerHTML=h;
  if(keep!=null){var f=document.getElementById("email");if(f){f.value=keep;f.focus();}}
}
function renderWelcome(){
  var el=document.getElementById("welcome"), seen=false; try{seen=!!localStorage.getItem("ct-welcome");}catch(e){}
  if(seen||S.mode==="loading"){el.hidden=true;return;}
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true, ios=/iPhone|iPad|iPod/.test(navigator.userAgent), signed=S.mode==="db";
  var h='<div class="row"><h3>Welcome</h3><span class="spacer"></span><button type="button" class="btn small ghost" data-welcome="done">Got it</button></div><ol>';
  h+=signed?'<li>You\'re signed in. Your log saves to your account and only you can see it.</li>'
           :'<li><b>Sign in</b> with your email so your log follows you between devices. Until then it stays on this phone. <button type="button" class="btn small" data-welcome="open">Sign in</button></li>';
  if(!standalone) h+='<li><b>Install it like an app:</b> '+(ios?'tap Share in Safari, then "Add to Home Screen".':'open the browser menu, then "Add to Home screen" or "Install app".')+'</li>';
  h+='<li><b>Set your targets.</b> The calorie cap and protein goal start at one person\'s numbers. <button type="button" class="btn small" data-welcome="open">Change them</button></li></ol>';
  el.innerHTML=h; el.hidden=false;
}
document.getElementById("welcome").addEventListener("click",function(e){
  var b=e.target.closest("[data-welcome]"); if(!b) return;
  if(b.dataset.welcome==="open"){toggleAccount(true);var f=document.getElementById("email")||document.getElementById("t-cap");if(f)f.focus();}
  else {try{localStorage.setItem("ct-welcome","1");}catch(x){}document.getElementById("welcome").hidden=true;}
});
function toggleAccount(open){
  var el=document.getElementById("account"); el.hidden=!open;
  document.getElementById("save").setAttribute("aria-expanded",open);
  if(open) renderAccount();
}
document.getElementById("save").addEventListener("click",function(){toggleAccount(document.getElementById("account").hidden);});
document.getElementById("account").addEventListener("submit",function(e){
  if(e.target.id==="targets"){e.preventDefault();var cap=+document.getElementById("t-cap").value,pr=+document.getElementById("t-prot").value;if(!(cap>=1000&&cap<=4000&&pr>=50&&pr<=300))return;put("settings",Object.assign(clone(S.docs.settings||{}),{cap:cap,prot:pr}));acct.saved=true;render();renderAccount();setTimeout(function(){acct.saved=false;},4000);return;}
  if(e.target.id!=="signin") return; e.preventDefault();
  var email=document.getElementById("email").value.trim(); if(!email) return;
  acct.busy=true;acct.err="";renderAccount();
  AppStore.signIn(email).then(function(){acct.sent=email;}).catch(function(err){acct.err="Couldn't send the link: "+(err&&err.message||"try again in a minute.");})
    .then(function(){acct.busy=false;renderAccount();});
});
document.getElementById("account").addEventListener("click",function(e){
  var b=e.target.closest("[data-acct]"); if(!b) return;
  if(b.dataset.acct==="signout"){AppStore.signOut().then(function(){location.reload();});}
  else if(b.dataset.acct==="export"){
    var blob=new Blob([JSON.stringify({app:"cut-tracker",exported:new Date().toISOString(),docs:S.docs},null,1)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="cut-tracker-backup-"+today()+".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  }
});
document.getElementById("account").addEventListener("change",function(e){
  if(e.target.id!=="import-file"||!e.target.files[0]) return;
  e.target.files[0].text().then(function(t){
    var j=JSON.parse(t), docs=j&&j.docs; if(!docs||typeof docs!=="object") throw new Error("not a Cut Tracker backup");
    var n=0; Object.keys(docs).forEach(function(k){if(!S.docs[k]||(docs[k].updated||"")>(S.docs[k].updated||"")){S.docs[k]=docs[k];dirty[k]=true;n++;}});
    saveLocal(); if(S.mode==="db") flush(); else dirty={};
    acct.err=""; render(); renderAccount();
    document.getElementById("account").insertAdjacentHTML("beforeend",'<p class="note">Imported '+n+' entries. Newer entries already here were kept.</p>');
  }).catch(function(err){acct.err="That file didn't import: "+err.message+".";renderAccount();});
});

/* ===== Boot: account if signed in, otherwise this device ===== */
function focusedInPanel(){var a=document.activeElement;return a&&a.closest&&a.closest(".panel")&&/INPUT|SELECT/.test(a.tagName);}
function useDevice(){uid=null;S.mode="local";S.docs=loadLocal("ct-docs");render();renderWelcome();}
async function connect(){
  var u=null;
  try{u=await AppStore.session();}catch(e){u=null;}
  if(!u){useDevice();return;}
  uid=u.id;
  var cached=loadLocal(), device=loadLocal("ct-docs"), remote;
  loadDirty().forEach(function(k){if(cached[k])dirty[k]=true;});
  try{remote=await AppStore.list();}
  catch(e){ // offline: work from the cached copy and sync later
    S.docs=cached; S.mode="db"; render(); renderWelcome(); return;
  }
  Object.keys(dirty).forEach(function(k){remote[k]=cached[k];});
  // Carry over anything logged on this device before signing in, then clear the device copy.
  Object.keys(device).forEach(function(k){if(!remote[k]||(device[k].updated||"")>(remote[k].updated||"")){remote[k]=device[k];dirty[k]=true;}});
  try{localStorage.removeItem("ct-docs");}catch(e){}
  S.docs=remote; S.mode="db"; saveLocal(); saveDirty();
  if(!focusedInPanel()) render(); else renderSave();
  toggleAccount(false); renderWelcome();
  flush();
}
async function refresh(){
  if(S.mode!=="db"||flushing||Object.keys(dirty).length) return;
  try{var remote=await AppStore.list(); S.docs=remote; saveLocal(); if(!focusedInPanel()) render();}catch(e){}
}
AppStore.onAuthChange(function(u,ev){if(ev==="SIGNED_IN"&&!uid)connect();});
document.addEventListener("visibilitychange",function(){if(!document.hidden){flush();refresh();}});
window.addEventListener("online",flush);
window.addEventListener("offline",renderSave);
connect();
if("serviceWorker" in navigator&&location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
